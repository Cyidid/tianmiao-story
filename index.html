<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>甜喵 Live2D 在线测试</title>
    <meta name="description" content="甜喵 Live2D 模型接入状态预览。" />
    <link rel="icon" href="pet/normal.png?v=live2d-gate" />
    <link rel="stylesheet" href="styles.css?v=live2d-gate" />
  </head>
  <body>
    <main class="page-shell">
      <section class="control-panel" aria-label="甜喵 Live2D 状态">
        <div>
          <p class="eyebrow">Tianmiao Story</p>
          <h1>甜喵 Live2D 在线测试</h1>
          <p class="intro">这里以后只渲染将进入 macOS app 的同一套 Live2D 模型。模型导出前，不再用 PNG 切片伪造动作。</p>
        </div>
        <div class="status-strip">
          <span>当前状态</span>
          <strong>模型待导出</strong>
          <small>已停止假动作预览</small>
        </div>
        <div class="action-grid" role="group" aria-label="Live2D 动作清单">
          <button disabled>待机</button>
          <button disabled>眨眼</button>
          <button disabled>点击反馈</button>
          <button disabled>行走</button>
          <button disabled>梳毛</button>
          <button disabled>挠抓</button>
        </div>
      </section>
      <section class="stage-panel" aria-label="甜喵模型预览">
        <div class="desktop-scene">
          <div class="desktop-bar"><span></span><span></span><span></span></div>
          <div class="bubble" aria-live="polite">Live2D 模型待接入</div>
          <div class="pet-static-wrap">
            <div class="pet-shadow"></div>
            <img class="pet-static" src="pet/normal.png?v=live2d-gate" alt="当前指定灰白虎斑甜喵形象" />
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
