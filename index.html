<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>甜喵物语在线测试</title>
    <meta name="description" content="服务器版甜喵桌宠动作预览。" />
    <link rel="icon" href="pet/normal.png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <section class="control-panel" aria-label="甜喵测试控制">
        <div>
          <p class="eyebrow">Tianmiao Story</p>
          <h1>甜喵物语在线测试</h1>
          <p class="intro">这是服务器版动作预览，用同一套透明分层素材模拟桌宠的待机、行走和互动动作。</p>
        </div>
        <div class="status-strip">
          <span>当前动作</span>
          <strong id="actionName">待机</strong>
          <small id="actionNote">轻微呼吸和尾巴摆动</small>
        </div>
        <div class="action-grid" role="group" aria-label="选择甜喵动作">
          <button class="active" data-action="idle">待机</button>
          <button data-action="walk">行走</button>
          <button data-action="groom">梳毛</button>
          <button data-action="scratch">挠抓</button>
          <button data-action="sleep">睡眠</button>
          <button data-action="roll">翻滚</button>
          <button data-action="hop">轻跳</button>
        </div>
      </section>
      <section class="stage-panel" aria-label="甜喵动作预览">
        <div class="desktop-scene">
          <div class="desktop-bar"><span></span><span></span><span></span></div>
          <div id="bubble" class="bubble" aria-live="polite">我在这里呀</div>
          <div id="petRig" class="pet-rig action-idle">
            <div class="pet-shadow"></div>
            <div class="sitting-rig">
              <img class="pet-layer sit-rig_tail" src="pet/rig_tail.png" alt="" />
              <img class="pet-layer sit-rig_haunches" src="pet/rig_haunches.png" alt="" />
              <img class="pet-layer sit-rig_body" src="pet/rig_body.png" alt="" />
              <img class="pet-layer sit-rig_paw_left" src="pet/rig_paw_left.png" alt="" />
              <img class="pet-layer sit-rig_paw_right" src="pet/rig_paw_right.png" alt="" />
              <img class="pet-layer sit-rig_head" src="pet/rig_head.png" alt="" />
            </div>
            <div class="walking-rig">
              <img class="pet-layer walk-walk_tail" src="pet/walk_tail.png" alt="" />
              <img class="pet-layer walk-walk_rear_leg" src="pet/walk_rear_leg.png" alt="" />
              <img class="pet-layer walk-walk_hind_leg" src="pet/walk_hind_leg.png" alt="" />
              <img class="pet-layer walk-walk_front_leg" src="pet/walk_front_leg.png" alt="" />
              <img class="pet-layer walk-walk_body" src="pet/walk_body.png" alt="" />
              <img class="pet-layer walk-walk_front_down_leg" src="pet/walk_front_down_leg.png" alt="" />
              <img class="pet-layer walk-walk_head" src="pet/walk_head.png" alt="" />
            </div>
          </div>
        </div>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
