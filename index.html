<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>甜喵 Live2D 在线测试</title>
    <meta name="description" content="甜喵 Live2D 模型接入状态预览。" />
    <link rel="icon" href="pet/normal.png?v=live2d-gate" />
    <link rel="stylesheet" href="styles.css?v=live2d-runtime" />
  </head>
  <body>
    <main class="page-shell">
      <section class="control-panel" aria-label="甜喵 Live2D 状态">
        <div>
          <p class="eyebrow">Tianmiao Story</p>
          <h1>甜喵 Live2D 在线测试</h1>
          <p class="intro">这里只渲染将进入 macOS app 的同一套 Live2D 模型。模型或 SDK 不完整时，动作会保持禁用。</p>
        </div>
        <div class="status-strip">
          <span>当前状态</span>
          <strong id="statusTitle">检查中</strong>
          <small id="statusNote">已停止 PNG 切片伪动作</small>
        </div>
        <div class="action-grid" role="group" aria-label="Live2D 动作清单">
          <button data-motion="idle" disabled>待机</button>
          <button data-motion="blink" disabled>眨眼</button>
          <button data-motion="tap" disabled>点击反馈</button>
          <button data-motion="walk" disabled>行走</button>
          <button data-motion="groom" disabled>梳毛</button>
          <button data-motion="scratch" disabled>挠抓</button>
        </div>
      </section>
      <section class="stage-panel" aria-label="甜喵模型预览">
        <div class="desktop-scene">
          <div class="desktop-bar"><span></span><span></span><span></span></div>
          <div id="bubble" class="bubble" aria-live="polite">正在检查 Live2D 模型</div>
          <div class="live2d-stage">
            <div class="pet-shadow"></div>
            <canvas id="live2dCanvas" class="live2d-canvas" width="720" height="784"></canvas>
            <img class="pet-static" src="pet/normal.png?v=live2d-gate" alt="当前指定灰白虎斑甜喵形象" />
          </div>
        </div>
      </section>
    </main>
    <script src="script.js?v=live2d-runtime"></script>
  </body>
</html>
